<main class="auth-page row g-0 min-vh-100">
  <app-auth-features />

  <section class="login-side col-12 col-md-6 d-flex flex-column justify-content-center px-4 py-5">
    <div class="login-content mx-auto w-75">
      <header class="mb-5">
        <h1 class="mb-2">Welcome Back</h1>
        <h3 class="text-body-secondary fw-normal fs-5 mb-0">Log in to your Breadwinners Financial Services account</h3>
      </header>
      <form (ngSubmit)="login()">
        <fieldset [disabled]="submitting()">
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Username</label>
            <div class="input-group input-group-lg">
              <span class="input-group-text bg-transparent"><i class="bi bi-person"></i></span>
              <input
                class="form-control border-start-0"
                type="text"
                name="username"
                id="username"
                placeholder="Enter your username"
                required
                [(ngModel)]="credentials.username"
              />
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group input-group-lg">
              <span class="input-group-text bg-transparent"><i class="bi bi-lock"></i></span>
              <input
                class="form-control border-start-0"
                [type]="showPassword() ? 'text' : 'password'"
                name="password"
                id="password"
                placeholder="Enter your password"
                required
                [(ngModel)]="credentials.password"
              />
              <button
                class="btn border border-start-0"
                type="button"
                (click)="showPassword.set(!showPassword())"
              >
                <i
                  class="bi"
                  [class.bi-eye]="showPassword()"
                  [class.bi-eye-slash]="!showPassword()"
                ></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn login-button btn-lg w-100 mt-3">
            @if (submitting()) {
              <span class="spinner-border spinner-border-sm me-2"></span>Logging in…
            } @else {
              Log In
            }
          </button>
        </fieldset>
        <!-- stretch goal -->
        <!-- <div class="text-center mt-3"><a class="forgot-link" href="">Forgot username or password?</a></div> -->
        <div class="d-flex align-items-center gap-3 my-4 text-body-secondary">
          <hr class="flex-grow-1" />
          <span>or</span>
          <hr class="flex-grow-1" />
        </div>
        <a class="btn create-account btn-lg w-100" routerLink="/register">Create an Account</a>
      </form>
    </div>
  </section>
</main>
