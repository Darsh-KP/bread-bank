<app-navigation-bar></app-navigation-bar>
<main class="profile-container">

  <!-- SVG Clip Path Definition -->
  <svg width="0" height="0" style="position: absolute;">
    <defs>
      <clipPath id="breadSliceShape" clipPathUnits="objectBoundingBox">
        <path d="M 0.05,0.2
                 C 0.05,0.05 0.25,0 0.5,0
                 C 0.75,0 0.95,0.05 0.95,0.2
                 C 0.95,0.24 0.9,0.25 0.9,0.28
                 L 0.9,0.92
                 C 0.9,0.97 0.85,1 0.8,1
                 L 0.2,1
                 C 0.15,1 0.1,0.97 0.1,0.92
                 L 0.1,0.28
                 C 0.1,0.25 0.05,0.24 0.05,0.2 C 0.05,0.2 0.05,0.2 0.05,0.2 Z" />
      </clipPath>
    </defs>
  </svg>

  @if (loading()) {
    <p class="state" role="status">Loading Profile Settings...</p>
  } @else if (initialLoadError()) {
    <p class="state state-error" role="alert">{{ initialLoadError() }}</p>
  } @else if (user(); as profile) {

    <!-- Single Connected Bread Container -->
    <div class="bread-card">
      <div class="bread-content">

        <header class="toast-header">
          <h2 class="header-title">Profile Settings</h2>
          <!-- Static Circular Badge (No Link) -->
          <div class="header-badge" aria-hidden="true">
            <img
              src="logo.png"
              alt="Breadwinners Financial Services Logo"
              class="header-badge-img"
            />
          </div>
        </header>

        <!-- Inner Content Area (Keeps fields safely away from crust edges) -->
        <div class="bread-body-inner">

          <!-- Username Section -->
          <section class="user-name-row">
            <label class="row-label" for="username">Username:</label>
            <div class="row-content">
              <input class="row-input" type="text" id="username" [value]="profile.username" readonly />
            </div>

            <!-- Non-clickable Badge using Bootstrap Icon -->
            <div class="badge-icon" aria-label="Read-only field" title="This field cannot be edited">
              <i class="bi bi-lock-fill"></i>
            </div>
          </section>

          <!-- First Name -->
          <editable-label
            label="First Name:"
            [value]="profile.firstName"
            [onSave]="saveFirstName"
            type="text"
            errorMessage="First name cannot be empty.">
          </editable-label>

          <!-- Last Name -->
          <editable-label
            label="Last Name:"
            [value]="profile.lastName"
            [onSave]="saveLastName"
            type="text"
            errorMessage="Last name cannot be empty.">
          </editable-label>

          <!-- Email -->
          <editable-label
            label="Email:"
            [value]="profile.email"
            [onSave]="saveEmail"
            [pattern]="emailPattern"
            errorMessage="Please enter a valid email address (Ex: example@example.com)."
            type="email">
          </editable-label>

          <!-- Phone -->
          <editable-label
            label="Phone Number:"
            [value]="profile.phone"
            [onSave]="savePhone"
            [pattern]="phonePattern"
            errorMessage="Please enter a valid phone number from 10-14 digits."
            type="tel">
          </editable-label>

          <!-- Change Password Trigger Button -->
          <button class="primary-btn" type="button" (click)="openPasswordModal()">
            <i class="bi bi-key-fill btn-icon-lead"></i>
            <span>Change Password</span>
          </button>

        </div>

      </div>
    </div>

    <!-- Password Modal
    <password-change-modal
      #passwordModal
      [onSave]="handlePasswordChange">
    </password-change-modal>
    -->

  }
</main>
