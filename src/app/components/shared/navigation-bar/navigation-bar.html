<mat-toolbar color="primary" class="app-navbar" aria-label="Primary navigation">
  <a class="brand" routerLink="/dashboard" aria-label="Breadwinners Financial Services home">
    <img src="logo.png" alt="" class="brand-logo">
    <span class="brand-text">Breadwinners Financial Services</span>
  </a>

  <button
    mat-icon-button
    class="mobile-menu-toggle"
    type="button"
    (click)="toggleMobileNav()"
    [attr.aria-expanded]="mobileNavOpen()"
    aria-controls="primary-navigation-links"
    [attr.aria-label]="mobileNavOpen() ? 'Close navigation menu' : 'Open navigation menu'"
  >
    <mat-icon>{{ mobileNavOpen() ? 'close' : 'menu' }}</mat-icon>
  </button>

  <nav
    id="primary-navigation-links"
    class="nav-links"
    [class.mobile-open]="mobileNavOpen()"
    aria-label="Main navigation"
  >
    <button
      mat-button
      routerLink="/dashboard"
      (click)="closeMobileNav()"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      aria-label="Dashboard"
    >
      <mat-icon>dashboard</mat-icon>
      <span>Dashboard</span>
    </button>

    <button
      mat-button
      [matMenuTriggerFor]="accountsMenu"
      (click)="closeMobileNav()"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: false }"
      aria-label="Accounts"
    >
      <span>Accounts</span>
      <mat-icon class="menu-caret">arrow_drop_down</mat-icon>
    </button>

    <button
      mat-button
      routerLink="/profile-settings"
      (click)="closeMobileNav()"
      routerLinkActive="active-link"
      aria-label="User settings"
    >
      <mat-icon>person</mat-icon>
      <span>User Settings</span>
    </button>
  </nav>

  <span class="spacer"></span>

  <button mat-flat-button color="warn" class="logout-button" (click)="logout()" aria-label="Log out">
    <mat-icon>logout</mat-icon>
    <span>Logout</span>
  </button>
</mat-toolbar>

<mat-menu #accountsMenu="matMenu">
  @for (account of accountItems; track account.label) {
    <button mat-menu-item [routerLink]="account.route" [attr.aria-label]="account.label">
      <span class="account-item-label">{{ account.label }}</span>
      @if (account.description) {
        <span class="account-item-description">{{ account.description }}</span>
      }
    </button>
  }
</mat-menu>
