<main>
  <h2>Profile Settings</h2>

  <!--Display loading message when fetching user information -->
  @if (loading()) {
    <p class="state" role="status">Loading Profile Settings...</p>
    <!-- Display error message if could not load data from database -->
  } @else if (initialLoadError()) {
    <p class="state state-error" role="alert">{{ initialLoadError() }}</p>
  } @else if (user(); as profile) {

    <!-- Username Section -->
    <section>
      <label for="username">Username:</label>
      <input type="text" id="username" [value]="profile.userName" readonly />
    </section>

    <!-- First Name -->
    <editable-label
      label="First Name:"
      [value]="profile.firstName"
      [onSave]="saveFirstName"
      type="text"
      errorMessage="First name cannot be empty.">
    </editable-label>

    <!-- Last Name -->
    <editable-label
      label="Last Name:"
      [value]="profile.lastName"
      [onSave]="saveLastName"
      type="text"
      errorMessage="Last name cannot be empty.">
    </editable-label>

    <!-- Email -->
    <editable-label
      label="Email:"
      [value]="profile.email"
      [onSave]="saveEmail"
      [pattern]="emailPattern"
      errorMessage="Please enter a valid email address (Ex: example@example.com)."
      type="email">
    </editable-label>

    <!-- Phone -->
    <editable-label
      label="Phone Number:"
      [value]="profile.phone"
      [onSave]="savePhone"
      [pattern]="phonePattern"
      errorMessage="Please enter a valid phone number from 10-14 digits."
      type="tel">
    </editable-label>

    <!-- Change Password Trigger Button -->
    <button type="button" (click)="openPasswordModal()">
      Change Password
    </button>

    <!-- Custom Angular Password Modal Component -->
      <!-- C:/Users/Gill/WebstormProjects/bread-bank/src/app/components/view/profile_settings/profile-settings.html -->

    <password-change-modal
      #passwordModal
      [onSave]="handlePasswordChange">
    </password-change-modal>

  }
</main>
