<mat-card class="account-card" appearance="outlined" (click)="goToAccount()">
  <mat-card-header>
<!--  if nickname is available, display nickname -> otherwise display marketingName  -->
    <mat-card-title>{{ account().nickname || account().marketingName }}</mat-card-title>
    <mat-card-subtitle>Account ending in {{ account().accountNumber.toString().slice(-4) }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="balance-label">Available balance</div>
    <div class="balance">
      {{ account().balanceInCents / 100 | currency:'USD':'symbol':'1.2-2' }}
    </div>
  </mat-card-content>

  <mat-card-actions align="end" (click)="$event.stopPropagation()">
    <transaction-button
      type="DEPOSIT"
      [accountNumber] = "account().accountNumber"
      (click)="$event.stopPropagation()"
    />

    <transaction-button
      type="WITHDRAW"
      [accountNumber] = "account().accountNumber"
      (click)="$event.stopPropagation()"
    />

    <button mat-stroked-button color="primary" routerLink="/transfer">
      <mat-icon>compare_arrows</mat-icon>
      Transfer
    </button>
  </mat-card-actions>
</mat-card>
